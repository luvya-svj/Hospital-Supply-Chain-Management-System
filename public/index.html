<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Supply Chain Management System</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            <path d="M12 11v4"/>
            <path d="M10 13h4"/>
          </svg>
        </div>
        <div>
          <div class="sidebar-title">HSCMS</div>
          <div class="sidebar-subtitle">Hospital Supply Chain</div>
        </div>
      </div>

      <!-- Navigation items rendered dynamically by role -->
      <nav class="sidebar-nav" id="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <div style="font-weight:600; color:var(--color-text);" id="footer-user-name">Loading...</div>
        <div id="footer-user-role" style="font-size:0.75rem; color:var(--color-primary);"></div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="top-bar-left">
          <button type="button" class="mobile-menu-btn" id="mobile-toggle" aria-label="Toggle Navigation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="page-title" id="page-heading">Dashboard</h1>
        </div>

        <div class="top-bar-right">
          <!-- Alert Bell (rendered only for relevant roles by JS) -->
          <a href="#alerts" class="alert-bell" id="alert-bell" style="display:none;" aria-label="View alerts" title="System Alerts">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="alert-badge" id="alert-badge" style="display:none;">0</span>
          </a>

          <!-- User Chip -->
          <div class="user-chip">
            <div class="user-avatar" id="user-avatar">U</div>
            <div class="user-info">
              <span class="user-name" id="user-name">Loading...</span>
              <span class="user-role-badge" id="user-role-badge">Role</span>
            </div>
          </div>

          <!-- Logout Button -->
          <button type="button" class="btn-logout" id="btn-logout" title="Sign out of HSCMS">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Logout</span>
          </button>
        </div>
      </header>

      <!-- Dynamic Page Content -->
      <main class="page-content" id="main-content">
        <div class="skeleton" style="height: 120px; margin-bottom: 1.5rem;"></div>
        <div class="skeleton" style="height: 300px;"></div>
      </main>
    </div>
  </div>

  <!-- Reusable Modal Container -->
  <div id="app-modal-wrapper" class="modal-backdrop"></div>

  <!-- Scripts -->
  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
